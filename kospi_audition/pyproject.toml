[project]
name = "kospi-audition"
version = "0.1.0"
description = "KOSPI/KOSDAQ Audition Pyramid Dashboard (v2.1 Dual-Horizon)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "duckdb>=0.10",
    "pykrx>=1.0.45",
    "loguru>=0.7",
    "pydantic>=2.6",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
    "ruff>=0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kap*"]

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
